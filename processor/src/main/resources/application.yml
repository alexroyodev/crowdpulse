spring:
  application:
    name: crowdpulse-processor
  datasource:
    hikari:
      # Fail in 3 s, not Hikari's default 30 s, when no connection can be had (spec 004): the
      # processor's backoff and the API's 503 depend on noticing it quickly.
      connection-timeout: 3000
      data-source-properties:
        # Seconds. A database that hangs (instead of refusing) would block a query forever.
        socketTimeout: 10
  docker:
    compose:
      # compose.yaml lives at the repository root; spring-boot:run uses processor/ as working directory.
      file: ../compose.yaml
      # Never stop the containers on shutdown: the API uses them too (plan 003, section 6).
      lifecycle-management: start-only
  mvc:
    # Errors of the dead-letter endpoint as RFC 9457 ProblemDetail, like the API's.
    problemdetails:
      enabled: true
  kafka:
    # Bootstrap servers: Spring Boot's default, localhost:9092, as published by compose.yaml.
    consumer:
      group-id: crowdpulse-processor
      # The first time the group starts, read the topic from the beginning: with Kafka's default
      # (latest) the events published before that first start would be skipped.
      auto-offset-reset: earliest
      # The listener container turns the client's enable.auto.commit off and commits itself.
    listener:
      # Commit each message's offset right after its database transaction (spec 003, rule 4).
      ack-mode: record
      # Spec 007: a span for each delivery of a message, child of the one in its traceparent header.
      observation-enabled: true
    template:
      # Spec 007: dead-letter publishes (and replays) get their span and traceparent header.
      observation-enabled: true

server:
  # The API listens on 8080.
  port: 8081
  # Spec 005: only reachable from this machine, which protects the dead-letter replay endpoint;
  # CROWDPULSE_PROCESSOR_ADDRESS=0.0.0.0 opens it to every address. Not authentication.
  address: ${CROWDPULSE_PROCESSOR_ADDRESS:127.0.0.1}
  error:
    include-stacktrace: never

management:
  tracing:
    sampling:
      # Spec 007: keep every trace locally (Spring Boot's default is 0.1); CROWDPULSE_TRACING_SAMPLING
      # lowers it without touching code.
      probability: ${CROWDPULSE_TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Jaeger of compose.yaml. 127.0.0.1, not localhost: on Windows localhost may go to ::1,
          # and compose publishes Jaeger only on 127.0.0.1. Spans are sent from a background
          # thread: if nobody listens, they are dropped and the events are not affected (rule 1).
          endpoint: ${CROWDPULSE_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
  observations:
    enable:
      # Spec 007, rule 6: the zone gauges refresh every 5 s (spec 006); a trace each time is noise.
      tasks.scheduled: false
  server:
    # Spec 006 (D1, ADR 0006): actuator gets its own server, which serves only health and prometheus,
    # so it can be open to every address: Prometheus runs in Docker and cannot reach 127.0.0.1 on
    # the host. The replay endpoint stays on server.port, local only (spec 005).
    port: 8082
    address: ${CROWDPULSE_MANAGEMENT_ADDRESS:0.0.0.0}
  endpoints:
    web:
      exposure:
        include: health, prometheus

logging:
  structured:
    format:
      console: ecs

crowdpulse:
  # Spec 002 (D1): enter a level at enter-pct, leave it only below exit-pct (hysteresis).
  alerts:
    warning:
      enter-pct: 85
      exit-pct: 80
    critical:
      enter-pct: 95
      exit-pct: 90
  metrics:
    # Spec 006: how often the zone gauges are read from the database (ZoneMetrics).
    zone-refresh: 5s
