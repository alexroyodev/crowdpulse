spring:
  application:
    name: crowdpulse-api
  docker:
    compose:
      # compose.yaml lives at the repository root; spring-boot:run uses api/ as working directory.
      file: ../compose.yaml
  # API texts are Spanish for every client: ignore Accept-Language and the OS locale.
  web:
    locale: es
    locale-resolver: fixed
  messages:
    fallback-to-system-locale: false

server:
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  structured:
    format:
      console: ecs

crowdpulse:
  events:
    # Maximum allowed distance of occurredAt into the future (spec 001).
    max-future-skew: 5m
  # Spec 002 (D1): enter a level at enter-pct, leave it only below exit-pct (hysteresis).
  alerts:
    warning:
      enter-pct: 85
      exit-pct: 80
    critical:
      enter-pct: 95
      exit-pct: 90
