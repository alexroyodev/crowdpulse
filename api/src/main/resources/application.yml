spring:
  application:
    name: crowdpulse-api
  datasource:
    hikari:
      # Fail in 3 s, not Hikari's default 30 s, when no connection can be had (spec 004): the
      # processor's backoff and the API's 503 depend on noticing it quickly.
      connection-timeout: 3000
      data-source-properties:
        # Seconds. A database that hangs (instead of refusing) would block a query forever. The API
        # only runs tiny queries, so 3 s (the processor uses 10): a sensor gets its 503 sooner.
        socketTimeout: 3
  docker:
    compose:
      # compose.yaml lives at the repository root; spring-boot:run uses api/ as working directory.
      file: ../compose.yaml
  # API texts are Spanish for every client: ignore Accept-Language and the OS locale.
  web:
    locale: es
    locale-resolver: fixed
  messages:
    fallback-to-system-locale: false
  kafka:
    # Bootstrap servers: Spring Boot's default, localhost:9092, as published by compose.yaml.
    template:
      # Spec 007: a span for each publish, and the trace context in the traceparent header, so the
      # processor continues the same trace.
      observation-enabled: true
    producer:
      # 202 only when the broker has stored the event (spec 003, rule 3).
      acks: all
      # How long POST /events may wait for Kafka before answering 503 (D3): about 3 s in total.
      properties:
        "[max.block.ms]": 3000
        "[request.timeout.ms]": 2000
        "[delivery.timeout.ms]": 3000

server:
  error:
    include-stacktrace: never

management:
  tracing:
    sampling:
      # Spec 007: keep every trace locally (Spring Boot's default is 0.1); CROWDPULSE_TRACING_SAMPLING
      # lowers it without touching code.
      probability: ${CROWDPULSE_TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Jaeger of compose.yaml. 127.0.0.1, not localhost: on Windows localhost may go to ::1,
          # and compose publishes Jaeger only on 127.0.0.1. Spans are sent from a background
          # thread: if nobody listens, they are dropped and the events are not affected (rule 1).
          endpoint: ${CROWDPULSE_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
  endpoints:
    web:
      exposure:
        # Spec 006: prometheus is scraped by the Prometheus of compose.yaml.
        include: health, prometheus

logging:
  structured:
    format:
      console: ecs

crowdpulse:
  events:
    # Maximum allowed distance of occurredAt into the future (spec 001).
    max-future-skew: 5m
