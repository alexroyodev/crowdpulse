# Spanish texts for the ProblemDetail responses that Spring MVC builds itself.
# Codes: problemDetail.title.<exception class> and problemDetail.<exception class>.
# Messages use java.text.MessageFormat: {n} are arguments and a literal quote is written ''.

# 404: no controller or resource for the path. {0} = requested path
problemDetail.title.org.springframework.web.servlet.resource.NoResourceFoundException=Recurso no encontrado
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=No existe el recurso ''{0}''.

# 405: {0} = method used, {1} = methods allowed
problemDetail.title.org.springframework.web.HttpRequestMethodNotSupportedException=Método no permitido
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=El método ''{0}'' no está permitido en este recurso. Métodos permitidos: {1}.

# 406: {0} = media types the endpoint can produce
problemDetail.title.org.springframework.web.HttpMediaTypeNotAcceptableException=Formato de respuesta no disponible
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException=No se puede responder en el formato pedido. Formatos disponibles: {0}.

# 415: {0} = content type received, {1} = content types accepted
problemDetail.title.org.springframework.web.HttpMediaTypeNotSupportedException=Tipo de contenido no soportado
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=El tipo de contenido ''{0}'' no está soportado. Tipos aceptados: {1}.

# 400: body is not valid JSON or does not match the expected types
problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=Petición mal formada
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=El cuerpo de la petición no se puede leer.

# 400: Bean Validation failed on the request body
problemDetail.title.org.springframework.web.bind.MethodArgumentNotValidException=Datos no válidos
problemDetail.org.springframework.web.bind.MethodArgumentNotValidException=La petición contiene campos no válidos.

# 400: a constraint on a request parameter failed (e.g. limit outside 1-500)
problemDetail.title.org.springframework.web.method.annotation.HandlerMethodValidationException=Parámetros no válidos
problemDetail.org.springframework.web.method.annotation.HandlerMethodValidationException=La petición contiene parámetros no válidos.

# 400: a request parameter cannot be converted (e.g. limit=abc). {0} = parameter, {1} = value
problemDetail.title.org.springframework.web.method.annotation.MethodArgumentTypeMismatchException=Parámetros no válidos
problemDetail.org.springframework.beans.TypeMismatchException=El parámetro ''{0}'' no admite el valor ''{1}''.
